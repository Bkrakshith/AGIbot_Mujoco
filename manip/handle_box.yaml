# Handle box for the X1 pinch-carry task. Generated by manip/handle_design.py;
# table heights and test results are added by manip/handle_task.py.
# Units m, kg, rad. Box frame: centre of the corrugated body, x forward,
# y left, z up (the pelvis axes at the hold). Handle entries are in the box frame.
box:
  size: [0.2, 0.26, 0.14]
  mass_total: 0.1
  body_mass: 0.07
  material: corrugated cardboard
handles:
  diameter: 0.031
  length: 0.11
  mass: 0.01
  friction: 1.0
  standoff_radius: 0.01
  standoff_mass: 0.005
  left:
    centre: [0.0, 0.2218, 0.045]
    axis_out: [-0.0239, 0.9957, 0.0896]
    standoff_root: [0.0022, 0.13, 0.0367]
    standoff_length: 0.0372
  right:
    centre: [0.0, -0.2218, 0.045]
    axis_out: [-0.0239, -0.9957, 0.0896]
    standoff_root: [0.0022, -0.13, 0.0367]
    standoff_length: 0.0372
hold:
  arm_pose: carry (configs/domain_rand.yaml arm_poses), both arms, no deviation
  arm_pose_rad_per_arm: [-0.5, -0.1, 0.0, 1.4, 0.0, 0.0]
  box_centre_in_pelvis_frame: [0.4899, 0.0, 0.2418]
  tcp_in_pelvis_frame_left: [0.4894, 0.2215, 0.2805]
  tcp_in_pelvis_frame_right: [0.4903, -0.2222, 0.2932]
  note: TCPs measured with the policy standing (PD arms sag ~0.12 m under the 0.43
    kg grippers); the kinematic carry TCP is ~0.12 m higher.
  tcp_std_mm:
  - [0.2, 2.9, 2.3]
  - [0.1, 2.5, 2.1]
  arm_tracking_error_rad: [0.111, 0.009, -0.013, -0.155, 0.001, 0.054, 0.101, 0.008,
    -0.011, -0.137, -0.002, 0.054]
camera:
  d435_in_pelvis: [0.085, 0.018, 0.4185]
  fov_blocked_fraction: 0.145
pick:
  box_centre_in_spawn_frame: [0.4599, 0.0161, 0.2401]
  grasp_depth_bias: 0.0
  tcp_mid_in_spawn_frame: [0.4599, 0.0161, 0.2851]
  tcp_mid_std_mm: [5.6, 11.0, 2.1]
  note: spawn frame = pelvis (yaw only) after 2 s standing with the arms down; the
    pelvis moves while the arms rise, so this differs from hold.box_centre_in_pelvis_frame
place_tables:
  low:
    arm_pose_rad_per_arm: [-0.2, -0.1, 0, 1.4, 0, -0.3]
    top_above_pelvis: 0.0743
    top_world_at_standing: 0.684
    envelope: {nearest_library_pose: carry, max_excess_over_noise_rad: 0.0}
  midlow:
    arm_pose_rad_per_arm: [-0.35, -0.1, 0, 1.4, 0, -0.15]
    top_above_pelvis: 0.111
    top_world_at_standing: 0.721
    envelope: {nearest_library_pose: carry, max_excess_over_noise_rad: 0.0}
  carry:
    arm_pose_rad_per_arm: [-0.5, -0.1, 0, 1.4, 0, 0.0]
    top_above_pelvis: 0.1528
    top_world_at_standing: 0.763
    envelope: {nearest_library_pose: carry, max_excess_over_noise_rad: 0.0}
  midhigh:
    arm_pose_rad_per_arm: [-0.65, -0.1, 0, 1.4, 0, 0.15]
    top_above_pelvis: 0.1991
    top_world_at_standing: 0.809
    envelope: {nearest_library_pose: carry, max_excess_over_noise_rad: 0.0}
  high:
    arm_pose_rad_per_arm: [-0.8, -0.1, 0, 1.4, 0, 0.3]
    top_above_pelvis: 0.2493
    top_world_at_standing: 0.859
    envelope: {nearest_library_pose: carry, max_excess_over_noise_rad: 0.0}
