# Low-level control for the AgiBot X1 (vendor MJCF: 12 leg joints; waist and
# arms are fixed links). Joint order = qpos order = actuator order
# (assets/PROVENANCE.md):
#   0-5   left leg:  hip_pitch hip_roll hip_yaw knee_pitch ankle_pitch ankle_roll
#   6-11  right leg: same
# The X1 hip-pitch axis is mounted at 45 deg and several left/right axes are
# mirrored, so joint SIGNS differ between legs (see default_pose).
#
# Values from agibot_x1_train humanoid/envs/x1/x1_dh_stand_config.py
# ("X1 cfg") unless noted. The X1 cfg runs 1 kHz physics / decimation 10 =
# 100 Hz policy; we keep the 100 Hz policy rate (the deployment contract) and
# run PD at 500 Hz for MJX throughput.

layout:
  n_legs_waist: 12          # fully learned position targets (legs only on X1)
  n_arm: 0                  # no arm joints on the X1 model
  leg_joints: 12            # qpos[7:19]
  knee_idx: [3, 9]          # joint index (qpos index = 7 + idx)
  hip_roll_idx: [1, 7]

control:
  physics_dt: 0.002        # 500 Hz physics (X1 cfg: 0.001)
  decimation: 5            # -> 100 Hz control (X1 cfg: 100 Hz)
  arm_residual_clip: 0.0   # unused, no arm joints

# X1 cfg control.stiffness / damping, per leg:
#   hip_pitch 30/3, hip_roll 40/3, hip_yaw 35/4, knee 100/10, ankle_pitch 35/0.5, ankle_roll 35/0.5
kp:
  [30, 40, 35, 100, 35, 35,
   30, 40, 35, 100, 35, 35]
kd:
  [3, 3, 4, 10, 0.5, 0.5,
   3, 3, 4, 10, 0.5, 0.5]

# X1 cfg control.action_scale = 0.5 for every joint.
action_scale_legs_torso:
  [0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
   0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

# X1 cfg init_state.default_joint_angles. Pelvis 0.613 m above the sole at
# this pose (X1 cfg base_height_target 0.61).
default_pose:
  [0.4, 0.05, -0.31, 0.49, -0.21, 0.0,
   -0.4, -0.05, 0.31, 0.49, -0.21, 0.0]

nominal_carry_pose: []     # no arm joints
